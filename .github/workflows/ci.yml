name: CI

on:
  push:
    branches:
      - develop
      - main
      - master
  pull_request:

env:
  IMAGE_NAME: ghcr.io/alexandr5321/web_infrastructure_deployment/apache

jobs:
  validate:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Apache image
        run: docker compose build apache

      - name: Start PostgreSQL and Apache
        run: docker compose up -d postgres apache

      - name: Wait for services
        run: |
          echo "Waiting for PostgreSQL and Apache..."

          for i in {1..30}; do
            POSTGRES_STATUS=$(docker inspect postgres \
              --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
              2>/dev/null || echo "missing")

            APACHE_STATUS=$(docker inspect apache \
              --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
              2>/dev/null || echo "missing")

            echo "PostgreSQL: $POSTGRES_STATUS"
            echo "Apache:     $APACHE_STATUS"

            if [ "$POSTGRES_STATUS" = "healthy" ] && [ "$APACHE_STATUS" = "healthy" ]; then
              echo "All services are healthy."
              exit 0
            fi

            sleep 2
          done

          echo "Services did not become healthy."
          exit 1

      - name: Show container status
        run: docker compose ps

      - name: Show PostgreSQL logs
        if: failure()
        run: docker compose logs postgres

      - name: Show Apache logs
        if: failure()
        run: docker compose logs apache

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Apache image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./apache
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:develop
