```yaml
name: CI

on:
  push:
    branches:
      - develop
      - main
      - master
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Apache image
        run: docker compose build apache

      - name: Start services
        run: docker compose up -d || true

      - name: Show container status
        if: always()
        run: docker compose ps

      - name: Show PostgreSQL logs
        if: always()
        run: docker compose logs postgres

      - name: Show Apache logs
        if: always()
        run: docker compose logs apache

      - name: Show Nginx logs
        if: always()
        run: docker compose logs nginx
```

