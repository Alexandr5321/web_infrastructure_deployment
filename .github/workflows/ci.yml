name: CI

on:
  push:
    branches:
      - develop
      - main
      - master
  pull_request:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/apache

jobs:
  validate:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Проверяем, что docker-compose.yml корректный
      - name: Validate Docker Compose
        run: docker compose config

      # Собираем Apache image
      - name: Build Apache image
        run: docker compose build apache

      # Запускаем Compose.
      # Временно разрешаем ошибку, чтобы получить логи PostgreSQL.
      - name: Start services
        run: docker compose up -d || true

      # Показываем состояние всех контейнеров
      - name: Show container status
        if: always()
        run: docker compose ps -a

      # Показываем PostgreSQL logs
      - name: Show PostgreSQL logs
        if: always()
        run: docker compose logs postgres

      # Показываем Apache logs
      - name: Show Apache logs
        if: always()
        run: docker compose logs apache

      # Показываем Nginx logs
      - name: Show Nginx logs
        if: always()
        run: docker compose logs nginx

      # Показываем Docker networks
      - name: Show Docker networks
        if: always()
        run: docker network ls

      # Показываем health status контейнеров
      - name: Show health status
        if: always()
        run: |
          for container in postgres apache nginx; do
            echo "===== $container ====="
            docker inspect "$container" \
              --format='{{.Name}} → {{if .State.Health}}{{.State.Health.Status}}{{else}}no healthcheck{{end}}' \
              2>/dev/null || true
          done

      # Логинимся в GitHub Container Registry
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Пока до GHCR не доходим, если Compose сломан.
      # Этот шаг нужен для проверки сборки Apache image.
      - name: Build Apache Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./apache
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:develop

