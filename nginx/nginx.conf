events {}

http {

    server {
        listen 80;

        server_name localhost;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;

        server_name localhost;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        location / {
            proxy_pass http://apache:80;
        }
    }
}
